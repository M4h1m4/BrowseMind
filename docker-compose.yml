version: '3.8'

services:
  browsemind:
    image: m4h1m4/browsemind:latest
    build:
      context: .
      target: browsemind
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # OpenAI key must be provided at runtime
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Persist evidence, artifacts, DB
      - ./evidence:/app/evidence
      - ./db:/app/db
    depends_on:
      - meditrack
      - stockwise
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  meditrack:
    image: m4h1m4/mediatrack:latest
    build:
      context: .
      target: meditrack
    ports:
      - "4300:4300"
    environment:
      - NODE_ENV=production
      - PORT=4300
    volumes:
      # Persist MediTrack DB
      - ./db/meditrack.db:/app/meditrack.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4300/"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockwise:
    image: m4h1m4/stockwise:latest
    build:
      context: .
      target: stockwise
    ports:
      - "4301:4301"
    environment:
      - NODE_ENV=production
      - PORT=4301
    volumes:
      # Persist StockWise DB
      - ./db/stockwise.db:/app/stockwise.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4301/"]
      interval: 10s
      timeout: 5s
      retries: 5